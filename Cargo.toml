[package]
name = "vinting-server"
version = "0.1.3"
edition = "2024"

build = "./build.rs"

[workspace]
members = ["dtos", "entity", "migrations", "services"]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

unwrap_used = "deny"
needless_match = "deny"
redundant_pattern = "deny"

print_stdout = "deny"
print_stderr = "deny"

[workspace.lints.rust]
missing_debug_implementations = "warn"

[lints]
workspace = true

[build-dependencies]
cargo-build = "1.0.0"

[workspace.dependencies]
sea-orm = { version = "2.0.0-rc.38", features = [
  "runtime-tokio-rustls",
  "sqlx-sqlite",
  "macros",
  "entity-registry",
  "schema-sync",
] }
tokio = { version = "1.52.2", features = ["full"] }
anyhow = "1.0.102"
thiserror = "2.0.18"
serde = "1.0.228"
log = "0.4.29"
strum = { version = "0.28.0", features = ["derive"] }
# all crates part of password_hash are undergoing a major version bump of the rand crate,
# which breaks the api, notably it removes OsRng, which is a big part of how you currently hash passwords
argon2 = "0.6.0-rc.8"

[dependencies]
entity = { path = "./entity" }
dtos = { path = "./dtos" }
services = { path = "./services" }
migrations = { path = "./migrations" }

sea-orm = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
argon2 = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true }

rocket = { version = "0.5.1", features = ["json"] }
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
chrono = "0.4.44"
dotenvy = "0.15.7"
const-hex = "1.19.0"
sha2 = "0.11.0"
log4rs = "1.4.0"

[profile.release]
opt-level = 3
lto = true
strip = true

# common option for release binaries
panic = "abort"
# compile times will be even longer with 1 codegen unit (sorry)
codegen-units = 1
